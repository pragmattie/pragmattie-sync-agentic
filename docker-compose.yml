# Planned services (added by the issues that create them):
#   crm-web        - CRM web app          - 5173
#   insights-web   - Delivery Insights    - 5174

services:
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-pragmattie_sync}:${MYSQL_PASSWORD:-pragmattie_sync}@db:3306/${MYSQL_DATABASE:-pragmattie_sync}
      CORS_ORIGINS: http://localhost:5173,http://pragmattie-sync.localhost
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  orchestrator:
    build: ./orchestrator
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-pragmattie_sync}:${MYSQL_PASSWORD:-pragmattie_sync}@db:3306/${MYSQL_DATABASE:-pragmattie_sync}
      CORS_ORIGINS: http://localhost:5174,http://insights.pragmattie-sync.localhost
    ports:
      - "8001:8001"
    volumes:
      - ./orchestrator:/orchestrator
    command: uvicorn sdlc.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pragmattie_sync}
      MYSQL_USER: ${MYSQL_USER:-pragmattie_sync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pragmattie_sync}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pragmattie_sync}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-pragmattie_sync}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
