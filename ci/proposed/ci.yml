# Proposed CI workflow. A person copies this to .github/workflows/ci.yml; see README.md here.
# Job names are matched by the required checks on main, so keep them unchanged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: CRM API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  orchestrator:
    name: Orchestrator (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orchestrator/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  crm-web:
    name: CRM web (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crm-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/crm-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  insights-web:
    name: Insights web (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/insights-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/insights-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  migrations:
    name: Migrations on MySQL
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pragmattie_sync
          MYSQL_USER: pragmattie_sync
          MYSQL_PASSWORD: pragmattie_sync
          MYSQL_ROOT_PASSWORD: pragmattie_sync
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -ppragmattie_sync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Documented local defaults from docker-compose.yml, not secrets.
      DATABASE_URL: mysql+pymysql://pragmattie_sync:pragmattie_sync@127.0.0.1:3306/pragmattie_sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            orchestrator/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install -r orchestrator/requirements-dev.txt
      - name: CRM API migrations
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Orchestrator migrations
        working-directory: orchestrator
        run: |
          alembic upgrade head
          alembic check
      - name: Orchestrator tests that need MySQL
        working-directory: orchestrator
        run: pytest tests/test_migrations.py -k mysql
      - name: Orchestrator downgrade
        working-directory: orchestrator
        run: alembic downgrade base
      - name: CRM API schema untouched by the orchestrator
        working-directory: apps/api
        run: alembic check
