# The whole stack: `docker compose up --build`. The proxy serves the CRM on
# http://pragmattie-sync.localhost and Delivery Insights on http://insights.pragmattie-sync.localhost,http://insights.pragmattie-sync.localhost:${PROXY_PORT:-80}
# (add :PROXY_PORT when it isn't 80, e.g. :18080 beside v1); each app also answers on its own port.
# The APIs are not proxied.
services:
  crm-web:
    build: ./apps/crm-web
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${CRM_WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/crm-web:/app
      - crm-web-node-modules:/app/node_modules
    command: npm run dev

  insights-web:
    build: ./apps/insights-web
    environment:
      VITE_ORCH_URL: http://localhost:${ORCH_PORT:-8001}
    ports:
      - "${INSIGHTS_WEB_PORT:-5174}:5174"
    volumes:
      - ./apps/insights-web:/app
      - insights-web-node-modules:/app/node_modules
    command: npm run dev

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-pragmattie_sync}:${MYSQL_PASSWORD:-pragmattie_sync}@db:3306/${MYSQL_DATABASE:-pragmattie_sync}
      CORS_ORIGINS: http://localhost:${CRM_WEB_PORT:-5173},http://pragmattie-sync.localhost,http://pragmattie-sync.localhost:${PROXY_PORT:-80}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  orchestrator:
    build: ./orchestrator
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-pragmattie_sync}:${MYSQL_PASSWORD:-pragmattie_sync}@db:3306/${MYSQL_DATABASE:-pragmattie_sync}
      CORS_ORIGINS: http://localhost:${INSIGHTS_WEB_PORT:-5174},http://insights.pragmattie-sync.localhost,http://insights.pragmattie-sync.localhost:${PROXY_PORT:-80}
      # For the demo reset and the pre-demo check; this service runs no poll loop.
      ORCHESTRATOR_MODE: ${ORCHESTRATOR_MODE:-off}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # only the check's --smoke uses it
    ports:
      - "${ORCH_PORT:-8001}:8001"
    volumes:
      - ./orchestrator:/orchestrator
    command: uvicorn sdlc.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2.10-alpine
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - crm-web
      - insights-web
    restart: unless-stopped

  # Reads the repository in GITHUB_REPO on a schedule, with GET requests only. It never runs the
  # agents. Start it with `docker compose --profile collect up -d`.
  collector:
    build: ./orchestrator
    profiles: ["collect"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-pragmattie_sync}:${MYSQL_PASSWORD:-pragmattie_sync}@db:3306/${MYSQL_DATABASE:-pragmattie_sync}
      ORCHESTRATOR_MODE: "off"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLANNER_MODE: ${PLANNER_MODE:-off}
      PLANNER_MODEL: ${PLANNER_MODEL:-claude-sonnet-5}
    volumes:
      - ./orchestrator:/orchestrator
    command: python -m sdlc.signals.github run --every ${COLLECT_SECONDS:-900}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # v2's agents in one poll loop, in ORCHESTRATOR_MODE. Beside v1, use ORCHESTRATOR_MODE=observe:
  # the agents decide and record but write nothing to GitHub, so the read-only token is enough.
  # Start it with `docker compose --profile agents up -d`.
  agents:
    build: ./orchestrator
    profiles: ["agents"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-pragmattie_sync}:${MYSQL_PASSWORD:-pragmattie_sync}@db:3306/${MYSQL_DATABASE:-pragmattie_sync}
      ORCHESTRATOR_MODE: ${ORCHESTRATOR_MODE:-off}
      POLL_SECONDS: ${POLL_SECONDS:-30}
      DIFF_CHAR_LIMIT: ${DIFF_CHAR_LIMIT:-60000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLANNER_MODE: ${PLANNER_MODE:-off}
      PLANNER_MODEL: ${PLANNER_MODEL:-claude-sonnet-5}
    volumes:
      - ./orchestrator:/orchestrator
    command: python -m sdlc.runner run
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pragmattie_sync}
      MYSQL_USER: ${MYSQL_USER:-pragmattie_sync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pragmattie_sync}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pragmattie_sync}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-pragmattie_sync}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  crm-web-node-modules:
  insights-web-node-modules:
